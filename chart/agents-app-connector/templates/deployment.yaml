{{- $tag := default .Chart.AppVersion .Values.image.tag }}
{{- $image := printf "%s:%s" .Values.image.repository $tag }}
{{- $settingsSum := include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
{{- range $component := list "admin" "app" }}
{{- $cfg := index $.Values.components $component }}
{{- $isApp := eq $component "app" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agents-app-connector.fullname" $ }}-{{ $component }}
  labels:
    {{- include "agents-app-connector.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  {{- if $isApp }}
  replicas: {{ include "agents-app-connector.appReplicas" $ }}
  strategy:
    type: Recreate
  {{- else }}
  replicas: {{ $cfg.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "agents-app-connector.componentLabels" (dict "context" $ "component" $component) | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/settings: {{ $settingsSum }}
        {{- with $cfg.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "agents-app-connector.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "agents-app-connector.imagePullSecrets" $ | nindent 6 }}
      serviceAccountName: {{ include "agents-app-connector.serviceAccountName" $ }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: migrate
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: ["migrate"]
          {{- include "agents-app-connector.env" (dict "context" $ "component" "migrate") | nindent 10 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: {{ $component }}
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ $image | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: [{{ $component | quote }}]
          {{- include "agents-app-connector.env" (dict "context" $ "component" $component) | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ $cfg.port }}
              protocol: TCP
            {{- if $isApp }}
            - name: mcp
              containerPort: {{ $cfg.mcpPort }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ $cfg.port }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ $cfg.port }}
          {{- with $cfg.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $isApp }}
            - name: data
              mountPath: /data
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $isApp }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "agents-app-connector.claimName" $ }}
        {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
