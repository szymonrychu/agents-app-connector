{{- if and .Values.postgres.url (not .Values.postgres.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agents-app-connector.databaseSecretName" . }}
  labels:
    {{- include "agents-app-connector.labels" . | nindent 4 }}
type: Opaque
stringData:
  uri: {{ .Values.postgres.url | quote }}
{{- end }}
{{- if and .Values.orchestrator.token (not .Values.orchestrator.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agents-app-connector.tokenSecretName" . }}
  labels:
    {{- include "agents-app-connector.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.orchestrator.token | quote }}
{{- end }}
{{- if and .Values.taskboard.token (not .Values.taskboard.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agents-app-connector.taskboardSecretName" . }}
  labels:
    {{- include "agents-app-connector.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.taskboard.token | quote }}
{{- end }}
