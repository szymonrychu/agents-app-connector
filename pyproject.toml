[project]
name = "agents-app-connector"
version = "0.1.0"
description = "Client-plugin connector for user devices on the agents platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agents-common @ git+https://github.com/szymonrychu/agents-common@v0.15.0",
    "fastapi",
    "starlette>=1.6",
    "python-multipart>=0.0.18",
    "pillow",
    "uvicorn[standard]",
    "httpx",
    "fastmcp>=4.1,<5",
]

[project.scripts]
agents-app-connector = "agents_app_connector.cli:main"

[dependency-groups]
dev = [
    "agents-common[testing] @ git+https://github.com/szymonrychu/agents-common@v0.15.0",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/agents_app_connector"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
addopts = "-q -p no:agents_common"
markers = [
    "e2e: end to end against the real app and admin processes, Postgres and the fakes",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
